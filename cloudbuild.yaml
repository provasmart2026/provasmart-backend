steps:
  - id: build-and-publish
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - southamerica-east1-docker.pkg.dev/$PROJECT_ID/provasmart/provasmart-backend:$BUILD_ID
      - --path
      - .
      - --builder
      - gcr.io/buildpacks/builder:google-24
      - --network
      - cloudbuild
      - --publish

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
